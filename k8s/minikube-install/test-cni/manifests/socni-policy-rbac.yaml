apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: socni-policy-manager
  namespace: kube-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["socni-policies"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: socni-policy-manager
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: socni-policy-manager
subjects:
- kind: ServiceAccount
  name: socni
  namespace: kube-system 