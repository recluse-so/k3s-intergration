<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="900" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Kubernetes CNI (Container Network Interface) Architecture</text>
  
  <!-- Node 1 -->
  <rect x="100" y="150" width="280" height="370" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="240" y="180" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Kubernetes Node 1</text>
  
  <!-- Node 2 -->
  <rect x="520" y="150" width="280" height="370" rx="10" ry="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2" />
  <text x="660" y="180" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Kubernetes Node 2</text>
  
  <!-- Pod 1 -->
  <rect x="120" y="210" width="120" height="80" rx="8" ry="8" fill="#d4edda" stroke="#28a745" stroke-width="2" />
  <text x="180" y="235" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Pod A</text>
  <text x="180" y="260" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">10.1.1.2</text>
  
  <!-- Pod 2 -->
  <rect x="120" y="310" width="120" height="80" rx="8" ry="8" fill="#d4edda" stroke="#28a745" stroke-width="2" />
  <text x="180" y="335" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Pod B</text>
  <text x="180" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">10.1.1.3</text>
  
  <!-- Pod 3 -->
  <rect x="540" y="210" width="120" height="80" rx="8" ry="8" fill="#d4edda" stroke="#28a745" stroke-width="2" />
  <text x="600" y="235" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Pod C</text>
  <text x="600" y="260" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">10.1.2.2</text>
  
  <!-- Pod 4 -->
  <rect x="540" y="310" width="120" height="80" rx="8" ry="8" fill="#d4edda" stroke="#28a745" stroke-width="2" />
  <text x="600" y="335" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Pod D</text>
  <text x="600" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">10.1.2.3</text>
  
  <!-- CNI Plugin Box for Node 1 -->
  <rect x="120" y="420" width="240" height="80" rx="8" ry="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2" />
  <text x="240" y="445" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">CNI Plugin</text>
  <text x="240" y="465" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(e.g., Calico, Flannel, Cilium)</text>
  <text x="240" y="485" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">- Creates interfaces, assigns IPs</text>
  
  <!-- CNI Plugin Box for Node 2 -->
  <rect x="540" y="420" width="240" height="80" rx="8" ry="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2" />
  <text x="660" y="445" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">CNI Plugin</text>
  <text x="660" y="465" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(e.g., Calico, Flannel, Cilium)</text>
  <text x="660" y="485" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">- Creates interfaces, assigns IPs</text>
  
  <!-- Kubelet on Node 1 -->
  <rect x="260" y="210" width="100" height="120" rx="8" ry="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2" />
  <text x="310" y="235" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Kubelet</text>
  <text x="310" y="260" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">1. Creates pod</text>
  <text x="310" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">2. Calls CNI</text>
  <text x="310" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">plugin to setup</text>
  <text x="310" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">networking</text>
  
  <!-- Kubelet on Node 2 -->
  <rect x="680" y="210" width="100" height="120" rx="8" ry="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2" />
  <text x="730" y="235" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Kubelet</text>
  <text x="730" y="260" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">1. Creates pod</text>
  <text x="730" y="280" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">2. Calls CNI</text>
  <text x="730" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">plugin to setup</text>
  <text x="730" y="320" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">networking</text>
  
  <!-- Network Overlay -->
  <path d="M 240 510 L 240 550 L 450 550 L 660 550 L 660 510" stroke="#0066cc" stroke-width="3" fill="none" stroke-dasharray="5,5" />
  <text x="450" y="570" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Overlay Network / Network Fabric</text>
  <text x="450" y="590" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Cross-node pod-to-pod communication</text>
  
  <!-- Connection lines - Fixed to avoid overlapping -->
  <path d="M 150 290 L 150 420" stroke="#28a745" stroke-width="2" fill="none" />
  <path d="M 190 390 L 190 420" stroke="#28a745" stroke-width="2" fill="none" />
  <path d="M 570 290 L 570 420" stroke="#28a745" stroke-width="2" fill="none" />
  <path d="M 610 390 L 610 420" stroke="#28a745" stroke-width="2" fill="none" />
  
  <!-- Pod-to-Pod Communication across nodes - Moved above nodes -->
  <path d="M 200 210 C 250 120, 650 120, 700 210" stroke="#dc3545" stroke-width="2" fill="none" stroke-dasharray="3,3" />
  <text x="450" y="100" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc3545">Pod-to-Pod Communication</text>
  
  <!-- Kubelet to CNI arrows -->
  <path d="M 310 330 L 310 380 L 240 380 L 240 420" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 730 330 L 730 380 L 660 380 L 660 420" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc" />
    </marker>
  </defs>
</svg>
