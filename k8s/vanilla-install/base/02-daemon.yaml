apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aranya-daemon
  namespace: aranya
spec:
  selector:
    matchLabels:
      app: aranya-daemon
  template:
    metadata:
      labels:
        app: aranya-daemon
    spec:
      initContainers:
      - name: policy-init
        image: busybox
        command: ["/bin/sh", "/etc/aranya/init-policy.sh"]
        volumeMounts:
        - name: policy-volume
          mountPath: /etc/aranya/policy
        - name: init-script
          mountPath: /etc/aranya/init-policy.sh
          subPath: init-policy.sh
      containers:
      - name: aranya-daemon
        image: aranya/daemon:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4321
          protocol: UDP
          name: dtls-sync
        volumeMounts:
        - name: factdb-storage
          mountPath: /var/lib/aranya
        - name: aranya-config
          mountPath: /etc/aranya
        - name: uds-socket
          mountPath: /var/run/aranya
        - name: policy-volume
          mountPath: /etc/aranya/policy
        env:
        - name: ARANYA_POLICY_PATH
          valueFrom:
            configMapKeyRef:
              name: aranya-policy
              key: policy-path
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -S /var/run/aranya/uds.sock
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -S /var/run/aranya/uds.sock
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: factdb-storage
        persistentVolumeClaim:
          claimName: aranya-factdb
      - name: aranya-config
        configMap:
          name: aranya-config
      - name: uds-socket
        emptyDir: {}
      - name: policy-volume
        configMap:
          name: aranya-policy
      - name: init-script
        configMap:
          name: aranya-policy-init
          defaultMode: 0755 